<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f6f8fa;
            color: #24292f;
        }
        h1 {
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 10px;
        }
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .repo-card {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .repo-name {
            font-weight: 600;
            color: #0969da;
            text-decoration: none;
            font-size: 1.1rem;
        }
        .repo-name:hover {
            text-decoration: underline;
        }
        .repo-desc {
            font-size: 0.9rem;
            color: #57606a;
            margin: 8px 0;
            flex-grow: 1;
        }
        .repo-meta {
            font-size: 0.8rem;
            color: #57606a;
            display: flex;
            gap: 12px;
        }
        .language-dot {
            width: 10px;
            height: 10px;
            background-color: #858585;
            border-radius: 50%;
            display: inline-block;
        }
        .loading {
            font-style: italic;
            color: #57606a;
        }
    </style>
</head>
<body>

    <h1 id="title">My GitHub Repositories</h1>
    <div id="loading" class="loading">Loading projects from GitHub...</div>
    <div id="repos" class="repo-grid"></div>

    <script>
        const username = 'jespeche'; 

        async function fetchRepos() {
            const repoContainer = document.getElementById('repos');
            const loadingText = document.getElementById('loading');
            document.getElementById('title').innerText = `${username}'s GitHub Portfolio`;

            try {
                // Fetch public repositories sorted by recent updates
                const response = await fetch(`https://github.com{username}/repos?sort=updated&per_page=100`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch repositories');
                }
                
                const repos = await response.ok ? await response.json() : [];
                loadingText.style.display = 'none';

                // Filter out forks if you only want your original work
                const myRepos = repos.filter(repo => !repo.fork);

                if (myRepos.length === 0) {
                    repoContainer.innerHTML = '<p>No public repositories found.</p>';
                    return;
                }

                myRepos.forEach(repo => {
                    const card = document.createElement('div');
                    card.className = 'repo-card';

                    card.innerHTML = `
                        <div>
                            <a class="repo-name" href="${repo.html_url}" target="_blank">${repo.name}</a>
                            <p class="repo-desc">${repo.description || 'No description provided.'}</p>
                        </div>
                        <div class="repo-meta">
                            ${repo.language ? `<span><span class="language-dot"></span> ${repo.language}</span>` : ''}
                            <span>⭐ ${repo.stargazers_count}</span>
                        </div>
                    `;
                    repoContainer.appendChild(card);
                });

            } catch (error) {
                loadingText.innerText = 'Error loading repositories. Please verify your username.';
                console.error(error);
            }
        }

        fetchRepos();
    </script>
</body>
</html>
